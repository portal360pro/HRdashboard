  return calEvents().filter(ev => ev.date === date && ev.hr === String(email || '').toLowerCase() && !ev.done && ev.c.id !== exceptId);
}
function isBusyDup(email, date, b) { return appCallsFor(email, date).some(ev => Math.abs(ev.s - b.s) < 2 && Math.abs(ev.e - b.e) < 2); }
function conflictsFor(email, date, s, e, exceptId) {
  if (!email || !date) return { calls: [], busy: [] };
  const calls = appCallsFor(email, date, exceptId).filter(ev => ev.s < e && s < ev.e);
  const busy = busyFor(email, date).filter(b => b.s < e && s < b.e && !isBusyDup(email, date, b) &&
    !appCallsFor(email, date).some(ev => ev.c.id === exceptId && Math.abs(ev.s - b.s) < 2));
  return { calls, busy };
}
function conflictText(email, date, s, e, exceptId) {
  const k = conflictsFor(email, date, s, e, exceptId);
  const who = hrName(email);
  const parts = k.calls.map(ev => `a 1:1 with <b>${esc(ev.c.leaderName)}</b> at ${esc(ampm(ev.c.schedTime))}`)
    .concat(k.busy.map(b => (b.title && b.title !== 'Busy' ? `<b>${esc(b.title)}</b>` : 'another meeting') + ` in Google Calendar (${esc(ampm(fromMin(b.s)))}–${esc(ampm(fromMin(b.e)))})`));
  return parts.length ? `⚠ <b>${esc(who)}</b> already has ${parts.join(' and ')}.` : '';
}
function freeSlots(email, date, len, exceptId) {
  const out = [], now = new Date(), today = todayStr(), nowM = now.getHours() * 60 + now.getMinutes();
  for (let m = CAL.h0 * 60; m + len <= CAL.h1 * 60; m += 30) {
    if (date < today || (date === today && m <= nowM)) continue;
    const k = conflictsFor(email, date, m, m + len, exceptId);
    if (!k.calls.length && !k.busy.length) out.push(m);
  }
  return out;
}
function loadBusy(from, to, emails, done) {
  const key = from + '|' + emails.join(',');
  if (CAL.busyCache[key] !== undefined || !emails.length) return;
  CAL.busyCache[key] = null;
  apiQ('getBusy', from, to, emails).then(r => { CAL.busyCache[key] = r || {}; done && done(); }).catch(() => { CAL.busyCache[key] = {}; });
}

function renderCalendar() {
  if (!CAL.start) CAL.start = mondayOf(todayStr());
  const days = (CAL.weekend ? 7 : 5), dates = Array.from({ length: days }, (_, i) => addDays(CAL.start, i));
  const team = S.cfg.hrTeam || [];
  const emails = CAL.hr ? [CAL.hr] : team.map(h => h.email);
  if (CAL.busy) loadBusy(CAL.start, addDays(CAL.start, 6), team.map(h => h.email), () => { if (S.view === 'calendar') renderCalendar(); });
  const all = calEvents().filter(ev => dates.includes(ev.date) && (!CAL.hr || ev.hr === CAL.hr));
  let h0 = CAL.h0, h1 = CAL.h1;
  all.forEach(ev => { h0 = Math.min(h0, Math.floor(ev.s / 60)); h1 = Math.max(h1, Math.ceil(ev.e / 60)); });
  const PX = 80, H = (h1 - h0) * PX;
  const y = m => (m - h0 * 60) / 60 * PX;
  const today = todayStr(), now = new Date(), nowM = now.getHours() * 60 + now.getMinutes();
  let clashN = 0;
  const busyRows = [];
  const cols = dates.map(d => {
    const evs = all.filter(ev => ev.date === d).sort((a, b) => a.s - b.s || a.e - b.e);
    evs.forEach(ev => { ev.clash = !ev.done && ev.hr && (evs.some(o => o !== ev && !o.done && o.hr === ev.hr && o.s < ev.e && ev.s < o.e) || conflictsFor(ev.hr, d, ev.s, ev.e, ev.c.id).busy.length > 0); if (ev.clash) clashN++; });
    let lanes = [], cluster = [], clusterEnd = -1;
    const flush = () => { cluster.forEach(ev => ev.n = lanes.length); lanes = []; cluster = []; };
    evs.forEach(ev => {
      if (ev.s >= clusterEnd) { flush(); clusterEnd = -1; }
      let i = lanes.findIndex(end => end <= ev.s);
      if (i < 0) { i = lanes.length; lanes.push(0); }
      lanes[i] = ev.e; ev.lane = i; cluster.push(ev); clusterEnd = Math.max(clusterEnd, ev.e);
    });
    flush();
    const busy = CAL.busy ? emails.flatMap(em => busyFor(em, d).filter(b => !isBusyDup(em, d, b)).map(b => Object.assign({ em }, b))) : [];
    const slots = [];
    for (let m = h0 * 60; m < h1 * 60; m += 30) {
      const past = d < today || (d === today && m + 30 <= nowM);
      slots.push(`<div class="slot ${past ? 'past' : ''} ${m % 60 ? '' : 'hr'}" style="top:${y(m)}px;height:${PX / 2}px" ${past ? '' : `data-slot="${d}|${fromMin(m)}"`}><span>+ ${esc(ampm(fromMin(m)))}</span></div>`);
    }
    const evHtml = evs.map(ev => {
      const col = hrColor(ev.hr), w = 100 / ev.n;
      return `<div class="ev ${ev.done ? 'done' : ''} ${ev.clash ? 'clash' : ''}" data-ev="${esc(ev.c.id)}" title="${esc(ev.c.leaderName)} · ${esc(ampm(ev.c.schedTime))} · ${esc(hrName(ev.hr) || 'Unassigned')}${ev.clash ? ' · OVERLAP' : ''}"
        style="top:${y(ev.s) + 1}px;height:${Math.max(22, y(ev.e) - y(ev.s) - 2)}px;left:calc(${ev.lane * w}% + 2px);width:calc(${w}% - 4px);border-left-color:${col};background:${col}1a">
        <b>${ev.clash ? '⚠ ' : ''}${ev.done ? '✓ ' : ''}${esc(ev.c.leaderName)}</b><span>${esc(ampm(fromMin(ev.s)))} · ${esc(hrName(ev.hr) || 'Unassigned')}</span></div>`;
    }).join('');
    busy.sort((a, b) => a.s - b.s || b.e - a.e);
    const bl = [];
    busy.forEach(b => { let i = bl.findIndex(end => end <= b.s); if (i < 0) { i = bl.length; bl.push(0); } bl[i] = b.e; b.lane = i; });
    const busyHtml = busy.map((b, bi) => {
      const top = y(Math.max(b.s, h0 * 60)), hgt = Math.max(16, y(Math.min(b.e, h1 * 60)) - top - 2);
      const lw = 100 / Math.max(1, bl.length), pos = `top:${top}px;height:${hgt}px;left:calc(${b.lane * lw}% + 2px);width:calc(${lw}% - 4px)`;
      const named = b.title && b.title !== 'Busy';
      const who = emails.length > 1 || b.em !== S.cfg.me ? ' · ' + esc(hrName(b.em)) : '';
      if (!named) return `<div class="busy" style="${pos}" title="Busy · ${esc(hrName(b.em))} · ${esc(ampm(fromMin(b.s)))}–${esc(ampm(fromMin(b.e)))}"><span>Busy${who}</span></div>`;
      CAL.gev = CAL.gev || {}; const key = d + '_' + bi; CAL.gev[key] = Object.assign({ date: d }, b);
      return `<div class="gev" style="${pos}" data-gev="${key}" title="${esc(b.title)} · ${esc(ampm(fromMin(b.s)))}–${esc(ampm(fromMin(b.e)))}">
        <b>${esc(b.title)}</b><span>${esc(ampm(fromMin(b.s)))}${who}</span>${b.meet && hgt >= 34 ? `<a class="gjoin" href="${esc(b.meet)}" target="_blank" rel="noopener">Join</a>` : ''}</div>`;
    }).join('');
    const nowLine = d === today && nowM > h0 * 60 && nowM < h1 * 60 ? `<div class="nowline" style="top:${y(nowM)}px"></div>` : '';
    const allDay = CAL.busy ? emails.flatMap(em => allDayFor(em, d)) : [];
    return { d, allDay, n: evs.filter(e => !e.done).length, html: slots.join('') + busyHtml + evHtml + nowLine };
  });
  Object.keys(CAL.busyCache).forEach(k => { const w = CAL.busyCache[k]; if (w && k.startsWith(CAL.start)) Object.keys(w).forEach(em => { if (w[em].error && emails.includes(em)) busyRows.push(hrName(em) + ': ' + w[em].error); }); });
  const wd = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const last = dates[dates.length - 1];
  const label = (() => { const a = new Date(CAL.start + 'T00:00:00'), b = new Date(last + 'T00:00:00');
    return a.getMonth() === b.getMonth() ? a.getDate() + ' – ' + b.getDate() + ' ' + MON[b.getMonth()] + ' ' + b.getFullYear() : dmy(CAL.start).replace(/ \d{4}$/, '') + ' – ' + dmy(last); })();
  $('#app').innerHTML = `
  <div class="khead">
    <div><span class="pill">${esc(rName(S.round))}</span><h1>Calendar</h1>
      <p class="sub" style="margin:0">Every scheduled 1:1 by HR person. Overlaps are red. Click any empty time to schedule a leader there.</p></div>
    <div class="toolbar" style="margin:0">
      <select class="tsel" id="calHr"><option value="">Everyone</option>${team.map(h => `<option value="${esc(h.email)}" ${h.email === CAL.hr ? 'selected' : ''}>${esc(h.name)}</option>`).join('')}</select>
      <button class="btn y" id="calNew">+ Schedule 1:1</button>
    </div>
  </div>
  <div class="card" style="padding:20px 22px">
    <div class="calbar">
      <button class="btn sm" id="calPrev">‹</button><button class="btn sm" id="calToday">Today</button><button class="btn sm" id="calNext">›</button>
      <b style="font-size:18px;margin-left:6px">${esc(label)}</b>
      ${clashN ? `<span class="tag t-open" style="margin-left:6px">⚠ ${clashN} overlapping call${clashN > 1 ? 's' : ''}</span>` : '<span class="tag t-done" style="margin-left:6px">No overlaps</span>'}
      <span style="flex:1"></span>
      <span class="calleg">${team.map(h => `<span><i style="background:${hrColor(h.email)}"></i>${esc(h.name)}</span>`).join('')}<span><i style="background:#e8eefc;border:1px solid #9db2e6"></i>Google Calendar</span><span><i class="hatch"></i>Busy (details not shared)</span></span>
    </div>
    <div class="calopts"><label class="toggle"><input type="checkbox" id="calBusy" ${CAL.busy ? 'checked' : ''}> Show Google Calendar events</label>
      <label class="toggle"><input type="checkbox" id="calWk" ${CAL.weekend ? 'checked' : ''}> Show weekend</label>
      ${busyRows.length ? `<span class="hint">Some calendars can't be read: ${esc([...new Set(busyRows)].join(' · '))}</span>` : ''}</div>
    <div class="calgrid" style="grid-template-columns:64px repeat(${days},1fr)">
      <div></div>${cols.map((c, i) => `<div class="calday ${c.d === today ? 'today' : ''}"><b>${wd[i]} ${Number(c.d.slice(8))}</b><span>${c.n ? c.n + ' check-in' + (c.n > 1 ? 's' : '') : 'no check-ins'}</span>${c.allDay.map(a => `<em class="allday" title="${esc(a.title)} (all day)">${esc(a.title)}</em>`).join('')}</div>`).join('')}
      <div class="caltimes" style="height:${H}px">${Array.from({ length: h1 - h0 }, (_, i) => `<span style="top:${i * PX}px">${esc(ampm(fromMin((h0 + i) * 60)).replace(':00', ''))}</span>`).join('')}</div>
      ${cols.map(c => `<div class="calcol ${c.d === today ? 'today' : ''}" style="height:${H}px">${c.html}</div>`).join('')}
    </div>
  </div>`;
  $('#calHr').onchange = e => { CAL.hr = e.target.value; renderCalendar(); };
  $('#calPrev').onclick = () => { CAL.start = addDays(CAL.start, -7); renderCalendar(); };
  $('#calNext').onclick = () => { CAL.start = addDays(CAL.start, 7); renderCalendar(); };
  $('#calToday').onclick = () => { CAL.start = mondayOf(todayStr()); renderCalendar(); };
  $('#calBusy').onchange = e => { CAL.busy = e.target.checked; renderCalendar(); };
  $('#calWk').onchange = e => { CAL.weekend = e.target.checked; renderCalendar(); };
  $('#calNew').onclick = () => scheduleModal(null, null, { hr: CAL.hr });
  $$('[data-gev]').forEach(g => g.onclick = e => { if (e.target.closest('.gjoin')) return; gevModal(CAL.gev[g.dataset.gev]); });
  $$('[data-slot]').forEach(s => s.onclick = () => { const [d, t] = s.dataset.slot.split('|'); scheduleModal(null, null, { date: d, time: t, hr: CAL.hr }); });
  $$('[data-ev]').forEach(b => b.onclick = () => {
    const c = S.calls.find(x => x.id === b.dataset.ev); if (!c) return;
    if (c.round !== S.round) S.round = c.round;
    openCall(c.leaderId);
  });
}

function availHtml(email, date, time, len, exceptId) {
  if (!email) return '<p class="hint" style="margin:0">Pick who runs the call to see their free times.</p>';
  if (!date) return '';
  const s = toMin(time), e = s + len;
  const h0 = CAL.h0, h1 = CAL.h1, span = (h1 - h0) * 60;
  const pct = m => Math.max(0, Math.min(100, (m - h0 * 60) / span * 100));
  const calls = appCallsFor(email, date, exceptId), busy = busyFor(email, date).filter(b => !isBusyDup(email, date, b));
  const warn = conflictText(email, date, s, e, exceptId);
  const free = freeSlots(email, date, len, exceptId);
  const wdn = new Date(date + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short' });
  return `<div class="avail">
    <div class="avail-h"><b>${esc(hrName(email))} · ${esc(wdn)} ${esc(dmy(date))}</b><span class="hint">${calls.length} 1:1${calls.length === 1 ? '' : 's'} booked${busy.length ? ' · ' + busy.length + ' other meeting' + (busy.length > 1 ? 's' : '') : ''}</span></div>
    <div class="avail-t">
      ${busy.map(b => `<i class="hatch" style="left:${pct(b.s)}%;width:${pct(b.e) - pct(b.s)}%" title="Busy in Google Calendar"></i>`).join('')}
      ${calls.map(ev => `<i style="left:${pct(ev.s)}%;width:${pct(ev.e) - pct(ev.s)}%;background:${hrColor(email)}" title="${esc(ev.c.leaderName)} ${esc(ampm(ev.c.schedTime))}"></i>`).join('')}
      ${time ? `<i class="pick ${warn ? 'bad' : ''}" style="left:${pct(s)}%;width:${pct(e) - pct(s)}%"></i>` : ''}
    </div>
    <div class="avail-x">${Array.from({ length: h1 - h0 + 1 }, (_, i) => i % 2 ? '' : `<span style="left:${i / (h1 - h0) * 100}%">${esc(ampm(fromMin((h0 + i) * 60)).replace(':00', ''))}</span>`).join('')}</div>
    ${warn ? `<div class="warnbox">${warn}</div>` : time ? '<div class="okline">✓ Free at this time</div>' : ''}
    <div class="lbl" style="margin-top:10px">Free times (${len} min)</div>
    <div class="chips">${free.slice(0, 14).map(m => `<button type="button" class="chip ${fromMin(m) === time ? 'on' : ''}" data-free="${fromMin(m)}">${esc(ampm(fromMin(m)))}</button>`).join('') || '<span class="hint">No free time left on this day — try another date.</span>'}</div>
  </div>`;
}

function gevModal(b) {
  if (!b) return;
  const wdn = new Date(b.date + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long' });
  modal(`<h3 style="margin-bottom:6px">${esc(b.title)}</h3>
    <p style="margin:0 0 4px;font-size:15px">${esc(wdn)}, ${esc(dmy(b.date))} · ${esc(ampm(fromMin(b.s)))} – ${esc(ampm(fromMin(b.e)))}</p>
    <p class="hint" style="margin:0 0 16px">From ${esc(hrName(b.em))}'s Google Calendar</p>
    <div class="acts" style="justify-content:flex-start;flex-wrap:wrap">
      ${b.meet ? `<a class="btn y" href="${esc(b.meet)}" target="_blank" rel="noopener">📹 Join Google Meet</a>` : ''}
      ${b.link ? `<a class="btn" href="${esc(b.link)}" target="_blank" rel="noopener">Open in Google Calendar</a>` : ''}
      <span style="flex:1"></span><button class="btn" data-close>Close</button></div>`);
}
function currentElapsed() { return S.timer.elapsed + (S.timer.running ? Date.now() - S.timer.startedAt : 0); }
function fmt(ms) {
  const t = Math.floor(ms / 1000), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return (h ? h + ':' + pad(m) : pad(m)) + ':' + pad(s);
}
function stopTick() { clearInterval(S.timer.tick); S.timer.tick = null; }
function toggleTimer() {
  const t = S.timer;
  if (t.running) { t.elapsed += Date.now() - t.startedAt; t.running = false; stopTick(); }
  else {
    t.running = true; t.startedAt = Date.now();
    if (!$('#fStart').value) $('#fStart').value = hhmm();
    if (!$('#fDate').value) $('#fDate').value = todayStr();
    $('#fStatus').value = 'Scheduled'; S.dirty = true;
    stopTick(); t.tick = setInterval(updateTimer, 500);
  }
  updateTimer();
}
function updateTimer() {
  const el = $('#timer'); if (!el) return;
  const ms = currentElapsed(), target = S.cfg.targetMins * 60000;
  el.innerHTML = fmt(ms) + `<small>${S.timer.running ? 'on call' : ms ? 'paused' : 'not started'} · target ${S.cfg.targetMins} min</small>`;
  el.className = 'timer' + (ms > target ? ' over' : ms > target - 5 * 60000 ? ' warn' : S.timer.running ? ' run' : '');
  const b = $('#tStart'); if (b) b.innerHTML = S.timer.running ? '❚❚ Pause' : (ms ? '▶ Resume' : '▶ Start call');
}
async function endCall() {
  if (!S.timer.running && !currentElapsed() && !confirm('The timer was not started. Mark this call as done anyway?')) return;
  if (S.timer.running) { S.timer.elapsed += Date.now() - S.timer.startedAt; S.timer.running = false; stopTick(); }
  $('#fEnd').value = hhmm();
  if (!$('#fStart').value) $('#fStart').value = hhmm(new Date(Date.now() - currentElapsed()));
  $('#fDur').value = Math.max(1, Math.round(currentElapsed() / 60000));
  if (!$('#fDate').value) $('#fDate').value = todayStr();
  updateTimer();
  saveCall($('#tEnd'), true).then(() => {
    toast('Call ended and saved. Check the answers, then click Mark as completed.');
    const b = $('#cDone'); if (b) b.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
}
function updateProgress() {
  if (!$('#progTxt')) return;
  let total = 0, done = 0;
  $$('.qi').forEach(q => { total++; const a = qAnswered(q); q.classList.toggle('answered', a); if (a) done++; });
  $('#progTxt').innerHTML = `${done} / ${total} <small>answered</small>`;
  $('#progBar').style.width = (total ? done / total * 100 : 0) + '%';
  $('#progTxt').closest('.prog').classList.toggle('full', total > 0 && done === total);
  if (S.flags) updateFlags();
}

function bindMeet() { renderMeet(); }

function tzLabel() {
  const tz = S.cfg.tz || '';
  if (tz === 'Asia/Manila') return 'PHT';
  try { const p = new Intl.DateTimeFormat('en-US', { timeZone: tz || undefined, timeZoneName: 'shortOffset' }).formatToParts(new Date()).find(x => x.type === 'timeZoneName'); return p ? p.value : ''; } catch (e) { return ''; }
}
function whenText(d, t) { return d ? dmy(d) + (t ? ' · ' + ampm(t) + (tzLabel() ? ' (' + tzLabel() + ')' : '') : '') : ''; }
function renderMeet() {
  const box = $('#cbMeet'); if (!box) return;
  const c = S.call, l = leader(c.leaderId);
  const who = hrName(c.conductedBy);
  const after = () => { S.dirty = false; openCall(S.call.leaderId); };
  const l1 = `<div class="l1">${c.schedDate ? '<b>' + esc(whenText(c.schedDate, c.schedTime)) + '</b>' : 'No date yet'} · ${who ? 'Assigned: <b>' + esc(who) + '</b>' : 'Unassigned'}</div>`;
  if (c.meetUrl) {
    box.innerHTML = l1 + `<div class="l2"><a href="${esc(c.meetUrl)}" target="_blank" rel="noopener" id="mLink">${esc(c.meetUrl.replace(/^https?:../, ''))}</a>
      <button class="btn y" id="mJoin">Join call</button><button class="btn" id="mCopy" title="Copy a ready-to-send invite message with the date, time and Meet link">Copy Invite</button></div>`;
    $('#mJoin').onclick = () => joinCall(c.meetUrl);
    $('#mLink').onclick = e => { e.preventDefault(); joinCall(c.meetUrl); };
    $('#mCopy').onclick = () => copyStr(inviteMsg(Object.assign({ plannedMins: S.cfg.targetMins }, c, { leaderName: l.name })), 'Invite copied — paste it in Slack or chat');
  } else {
    box.innerHTML = l1 + `<div class="l2"><button class="addlink" id="mSched">+ Schedule Google Meet</button></div>`;
    $('#mSched').onclick = () => { window.open(gcalNewUrl(l), '_blank'); meetLinkModal(c.leaderId, { call: S.call, opened: true, after }); };
  }
}

S.rec = { win: null, state: 'idle', file: null, note: '' };
function recActive() { return false; }

function joinCall(meetUrl) {
  const w = window.open(meetUrl, '_blank');
  if (w && !$('#fStart').value) { $('#fStart').value = hhmm(); if (!$('#fDate').value) $('#fDate').value = todayStr(); }
  toast(w ? 'Google Meet opened' : 'Your browser blocked the Meet tab. Allow pop-ups for this site, or use Copy and open the link yourself.', !w);
}

function downloadBlob(blob, name) {
  const a = document.createElement('a');
  const url = URL.createObjectURL(blob);
  a.href = url; a.download = name; a.style.display = 'none';
  document.body.appendChild(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 60000);
}



boot();
</script>
