<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#18181b;--ink2:#27272a;--muted:#6b6b72;--line:#e7e5df;--line2:#efeee9;--bg:#f5f5f0;--card:#fff;--y:#ffe11b;--y2:#fff4b0;--y3:#fffbe0;
  --green:#1f7a45;--green2:#e3f4e8;--lime:#4d7c0f;--lime2:#eef6e2;--red:#c62828;--red2:#fde8e8;--amber:#9a6200;--amber2:#fff1d6;
  --blue2:#e6edfb;--blue:#2f5bb7;--r:16px}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button{font:inherit;cursor:pointer;color:inherit}
a{color:inherit}
h1,h2,h3,.brand,.kpi b,.big-n{font-family:Poppins,Inter,system-ui,sans-serif}
.layout{display:flex;min-height:100vh}
.sidenav{position:sticky;top:0;height:100vh;width:220px;flex-shrink:0;background:var(--ink);color:#fff;display:flex;flex-direction:column;padding:22px 14px 16px;z-index:40;overflow-y:auto}
.brand{font-weight:800;font-size:22px;letter-spacing:-.4px;white-space:nowrap;padding:2px 10px 22px}
.brand i{color:var(--y);font-style:normal}
.navsec-h{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;color:#a1a1aa;font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;padding:8px 10px;border-radius:8px}
.navsec-h:hover{color:#fff}
.navsec-h .car{transition:transform .15s}
.navsec.closed .navsec-h .car{transform:rotate(-90deg)}
.navsec.closed .tabs{display:none}
.mods{display:flex;flex-direction:column;gap:2px}
.acc{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 12px}
.acc label{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:12px;cursor:pointer;background:#fff}
.acc label:has(input:checked){background:var(--y3);border-color:#e6cf3a}
.acc input{accent-color:var(--ink)}
.acc .all{font-size:12px;color:var(--muted);padding:4px 0}
.mods button{background:none;border:0;color:#d4d4d8;padding:9px 12px;border-radius:10px;font-size:15px;text-align:left;width:100%}
.mods button:hover{background:#27272a;color:#fff}
.mods button.on{background:var(--y);color:var(--ink);font-weight:600}
.tabs{display:flex;align-items:center;gap:6px}
.tabs button{background:none;border:0;color:#3f3f46;padding:8px 14px;border-radius:9px;font-size:15px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tabs button:hover{background:#f1f0ea;color:var(--ink)}
.tabs button.on{background:var(--y);color:var(--ink);font-weight:600}
.sidefoot{margin-top:auto;border-top:1px solid #3f3f46;padding:14px 10px 0;display:flex;flex-direction:column;gap:10px}
.shell{flex:1;min-width:0}
.topbar{position:sticky;top:0;z-index:36;height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 26px;overflow-x:auto}
.topbrand{display:flex;align-items:center;font-family:Poppins,Inter,sans-serif;font-weight:800;font-size:20px;letter-spacing:-.3px}
.modtabs{display:flex;gap:28px}
.modtabs button{background:none;border:0;border-bottom:3px solid transparent;padding:0 2px;font-size:15px;font-weight:600;color:#71717a}
.modtabs button:hover{color:var(--ink)}
.modtabs button.on{color:var(--ink);border-bottom-color:var(--y)}
.badge{background:#c62828;color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px;min-width:20px;text-align:center}
.badge:empty{display:none}
.whoami{color:#a1a1aa;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.gear{background:none;border:1px solid #3f3f46;color:#d4d4d8;border-radius:10px;padding:9px 12px;font-size:14px;text-align:left}
.gear:hover{background:#27272a;color:#fff}
.btn{text-decoration:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#c9c6bd}
.btn.y{background:var(--y);border-color:var(--y)}
.btn.y:hover{filter:brightness(.97)}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.ghost{background:transparent;color:#fff;border-color:#52525b}
.btn.red{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.wide{width:100%;padding:13px}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;padding:0;text-decoration:underline;font-weight:500;cursor:pointer}
main{max-width:1320px;margin:0 auto;padding:30px 32px 70px}
.pill{display:inline-block;background:var(--y);font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;padding:5px 12px;border-radius:99px}
h1{font-size:34px;letter-spacing:-.6px;margin:12px 0 6px;line-height:1.15}
h1 .mut{color:#52525b}
.sub{color:#52525b;margin:0 0 22px;font-size:15px}
.back{display:inline-block;margin-bottom:6px;font-weight:500}
.card{background:var(--card);border-radius:var(--r);padding:22px 24px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card h3{margin:0 0 16px;font-size:19px;letter-spacing:-.2px}
.card.ytop{border-top:5px solid var(--y)}
.grid{display:grid;gap:18px}
.head-row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:12px}
.empty{color:var(--muted);padding:18px 0;text-align:center}
.in{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;background:#fff;color:var(--ink)}
.in:focus{outline:2px solid var(--y);border-color:#d8c200}
textarea.in{resize:vertical;min-height:64px}
select.in{appearance:auto}
.f label,.lbl{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#3f3f46}
.f{margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:18px}
.kpis.k4{grid-template-columns:repeat(4,1fr)}
.kpi{position:relative;padding:26px 26px 20px}
.kpi:before{content:"";position:absolute;top:22px;left:26px;width:36px;height:5px;border-radius:4px;background:var(--y)}
.kpi b{display:block;font-size:44px;margin-top:12px;letter-spacing:-1px;line-height:1.1;font-weight:800}
.kpi b small{font-size:18px;color:#52525b;font-weight:600;letter-spacing:0;font-family:Inter,sans-serif}
.kpi span{color:#52525b;font-size:15px}
.kpi span strong{color:var(--ink);font-weight:700}
.kbar{height:7px;background:#ecebe5;border-radius:9px;margin-top:16px;overflow:hidden}
.kbar i{display:block;height:100%;border-radius:9px}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:4px 12px;border-radius:99px;white-space:nowrap}
.t-none{background:#ecebe6;color:#52525b}
.t-sched{background:var(--blue2);color:var(--blue)}
.t-done{background:var(--green2);color:var(--green)}
.t-open{background:var(--red2);color:var(--red)}
.t-prog{background:var(--amber2);color:var(--amber)}
.t-cat{background:#efeee9;color:#3f3f46;border-radius:7px;font-size:12px;padding:3px 10px}
.t-active{background:var(--green2);color:var(--green)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:14px;color:#3f3f46;font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:14px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:0}
td .hint{font-size:13px;margin-top:2px}
td.nw{white-space:nowrap}
.colbtn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border:1px solid var(--line);background:#fff;border-radius:7px;font-size:10px;margin-left:8px;vertical-align:middle;color:#3f3f46}
.colbtn.on{background:var(--y);border-color:var(--y)}
.datebtn{border:1.5px dashed #d6d3c8;background:#fff;border-radius:9px;padding:7px 10px;color:var(--muted);font-size:13px}
.datebtn:hover{border-color:var(--ink);color:var(--ink)}
.tsel{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;background:#fff;min-width:150px}
.foot{color:#52525b;font-size:14px;padding:14px 14px 4px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .in{width:auto}
.selbox{display:flex;align-items:center;gap:10px}
.selbox label{color:#52525b;font-weight:500}
.selbox select{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:15px;background:#fff;min-width:110px}
.fmenu{position:absolute;z-index:70;background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);width:340px;padding:12px 18px 16px;border:1px solid var(--line)}
.fmenu .srt{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 6px;font-size:15px;border-radius:8px}
.fmenu .srt:hover{background:#f6f5f0}
.fmenu hr{border:0;border-top:1px solid var(--line);margin:8px 0 12px}
.fmenu .vals{max-height:230px;overflow:auto;margin-top:10px}
.fmenu .val{display:flex;align-items:center;gap:10px;padding:7px 6px;font-size:15px;cursor:pointer}
.fmenu .val span{flex:1}
.fmenu .val em{font-style:normal;color:#52525b}
.fmenu input[type=checkbox]{width:17px;height:17px;accent-color:var(--ink)}
.fmenu .acts{display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line);margin-top:10px;padding-top:12px}
.callgrid{display:grid;grid-template-columns:1fr 420px;gap:22px;align-items:start}
.side{position:sticky;top:142px;display:grid;gap:18px}
.sec{margin-bottom:18px}
.sec>.pill{margin-bottom:14px}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.meetbar{background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px 12px 18px;display:flex;align-items:center;gap:14px;margin-top:16px}
.meetbar b{white-space:nowrap}
.meetbar code{font-size:14px;color:#d4d4d8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.meetbar .in{background:#27272a;border-color:#3f3f46;color:#fff;flex:1;padding:7px 10px}
.meetopts{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
.q{padding:16px 0;border-top:1px solid var(--line2)}
.q:first-of-type{border-top:0;padding-top:4px}
.q-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:10px}
.q-title{font-weight:600;font-size:16px}
.q-ask{color:#52525b;font-size:13px;margin-top:2px}
.q-tr{display:none;font-size:13px;color:var(--blue);font-style:italic;margin-top:3px}
.show-tr .q-tr{display:block}
.q-tr:empty{display:none!important}
.scale{display:flex;gap:6px;flex-shrink:0}
.scale button{width:44px;height:44px;border-radius:9px;border:1px solid #d6d3c8;background:#fff;font-weight:600;font-size:16px}
.scale button:hover{border-color:var(--ink)}
.scale button.on{background:var(--ink);color:var(--y);border-color:var(--ink);font-weight:700;width:46px;height:62px;margin-top:-9px}
.scale button.on.ai{box-shadow:0 0 0 3px var(--y)}
.scale-help{font-size:11px;color:var(--muted);text-align:right;margin-top:4px}
.q[data-key]:not(.answered) .scale-help:after{content:" · not picked yet";color:var(--amber);font-weight:600}
.seg{display:flex;gap:6px;margin:8px 0 14px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 0;width:120px;font-weight:600;font-size:15px}
.seg button.on{background:var(--ink);color:var(--y);border-color:var(--ink)}
.seg button.on.ai{box-shadow:0 0 0 3px var(--y)}
.oq{margin-bottom:14px}
.oq .lbl{font-size:13px;font-weight:600;color:#3f3f46}
.ai{background:var(--y3)!important;border-color:#f0d64a!important}
.crow{display:grid;grid-template-columns:200px 1fr 170px 28px;gap:10px;margin-bottom:10px;align-items:start}
.crow .x{border:0;background:none;color:#52525b;font-size:20px;padding-top:6px}
.bottom-acts{display:flex;justify-content:flex-end;gap:12px;border-top:1px solid var(--line);padding-top:18px;margin-top:4px}
.bottom-acts .btn{padding:12px 20px;font-size:15px}
.fb{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.note{background:#f4f3ee;border-radius:10px;padding:10px 12px;font-size:12px;color:#52525b}
.toggle{display:flex;gap:8px;align-items:center;font-size:13px;margin:6px 0;cursor:pointer}
.upl{border:1.5px dashed #d6d3c8;border-radius:12px;padding:12px;text-align:center;cursor:pointer;font-size:13px;color:#52525b;margin-top:12px}
.upl:hover{border-color:#c9b500;background:var(--y3)}
.track{height:12px;background:#ecebe5;border-radius:99px;overflow:hidden;display:flex}
.track i{display:block;height:100%}
.earlier .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line2)}
.earlier .row:first-child{border-top:0}
.script label{display:flex;gap:8px;margin:6px 0;cursor:pointer;font-size:13px}
.script label.ck span{text-decoration:line-through;color:var(--muted)}
#callbar{position:sticky;top:56px;z-index:35}
.callbar{background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.04)}
.callbar .in-bar{max-width:1320px;margin:0 auto;padding:10px 32px;display:flex;align-items:center;gap:14px}
.callbar .who b{font-size:15px}
.callbar .who div{color:var(--muted);font-size:12px}
.timer{font-variant-numeric:tabular-nums;font-size:28px;font-weight:800;letter-spacing:-.5px;padding:3px 16px;border-radius:12px;background:#f3f2ed;min-width:150px;text-align:center}
.timer.run{background:var(--ink);color:var(--y)}
.timer.warn{background:var(--y);color:var(--ink)}
.timer.over{background:var(--red);color:#fff}
.timer small{display:block;font-size:11px;font-weight:500;letter-spacing:0;opacity:.75;margin-top:-3px}
.prog{font-size:12px;color:var(--muted);text-align:right}
.prog .pt{width:120px;height:6px;background:#ecebe5;border-radius:9px;margin-top:4px;overflow:hidden}
.prog .pt i{display:block;height:100%;background:var(--ink)}
.recbadge{border:0;border-radius:10px;padding:9px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.recbadge.rec{background:var(--red);color:#fff}
.recbadge.miss{background:var(--y);color:var(--ink);animation:pulse 1.2s infinite}
.recbadge.ok{background:var(--green2);color:var(--green)}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(198,40,40,.25)}}
.recdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);margin-right:6px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.recbox .big,.meet .big{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;font-size:14px}
.people{display:grid;grid-template-columns:400px 1fr;gap:22px;align-items:start}
.kgrid{display:grid;grid-template-columns:1.12fr .88fr;gap:20px;align-items:start}
.khead{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;margin-bottom:22px}
.kcard{background:#fff;border-radius:14px;border-left:5px solid var(--y);padding:18px 22px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.kcard .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kcard .top .r{margin-left:auto;color:#52525b;font-size:13px}
.kcard .txt{font-size:15px;margin:10px 0 12px}
.kcard .res{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.kcard .res .btn{border-radius:99px;font-weight:500;padding:7px 13px;font-size:14px}
.kcard .res .btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.kcard .stt{display:flex;justify-content:flex-end;margin-top:8px}
.hbar{display:grid;grid-template-columns:200px 1fr 30px;gap:14px;align-items:center;margin:12px 0;font-size:13px}
.hbar .track{height:10px}
.hbar .track i{background:var(--ink)}
.hbar b{text-align:right}
.lrow{display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line2);font-size:15px}
.lrow:first-of-type{border-top:0}
.rcards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.rcard{border-top:5px solid var(--y);padding:28px 30px}
.rcard .tt{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.rcard .tt b{font-size:22px;font-family:Poppins,Inter,sans-serif}
.rcard .nums{display:flex;gap:44px;margin:30px 0 20px}
.rcard .nums b{display:block;font-size:44px;font-weight:800;font-family:Poppins,Inter,sans-serif;line-height:1.1}
.rcard .nums span{color:#52525b;font-size:15px}
.rcard .ft{display:flex;justify-content:space-between;align-items:center;color:#52525b;font-size:15px}
.sum-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;align-items:start}
.rt td,.rt th{text-align:center;padding:12px 10px}
.rt td:first-child,.rt th:first-child{text-align:left;padding-left:14px}
.sc{display:inline-block;min-width:64px;padding:7px 0;border-radius:9px;font-weight:600;font-size:16px}
.sc.g1{background:var(--green2);color:var(--green)}
.sc.g2{background:var(--lime2);color:var(--lime)}
.sc.a{background:var(--amber2);color:var(--amber)}
.sc.r{background:var(--red2);color:var(--red)}
.sc.n{background:#ecebe6;color:var(--ink)}
.gbar{display:grid;grid-template-columns:140px 1fr 140px;gap:14px;align-items:center;margin:12px 0;font-size:15px}
.gbar b{font-weight:600}
.gbar .track i{background:var(--ink)}
.gbar span{color:#52525b;font-size:14px}
.legend{display:flex;gap:18px;color:#52525b;font-size:14px;margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.pres{display:flex;align-items:center;gap:16px;border:1.5px dashed #e6dfb0;background:#fffef6;border-radius:14px;padding:14px 16px;margin-bottom:10px}
.pres .play{width:52px;height:52px;border-radius:12px;background:var(--y);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.pres div{flex:1;min-width:0}
.pres b{display:block;font-size:16px}
.pres span{color:#52525b;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.topics{display:grid;grid-template-columns:repeat(5,1fr);gap:20px}
.topic{border-left:5px solid var(--y);padding:4px 0 4px 18px}
.topic b{display:block;font-size:34px;font-family:Poppins,Inter,sans-serif;font-weight:800}
.topic span{color:#52525b;font-size:15px}
.modal-bg{position:fixed;inset:0;background:rgba(24,24,27,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:70px 16px;overflow:auto}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;padding:24px}
.modal h3{margin:0 0 16px;font-size:20px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.okbox{background:var(--green2);border-radius:12px;padding:14px;margin-bottom:12px}
.msgbox{white-space:pre-wrap;background:#f6f5f0;border-radius:10px;padding:12px;font-size:13px}
.qe{display:grid;grid-template-columns:22px 180px 1fr 200px auto;gap:6px;margin-bottom:6px;align-items:center}
.qe.qe-o{grid-template-columns:22px 1fr auto}
.qe-btns{display:flex;gap:4px}
.team-row{display:grid;grid-template-columns:140px 1fr 32px;gap:6px;margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;z-index:90;display:none;max-width:90vw}
#toast.err{background:var(--red)}
.loading{padding:60px;text-align:center;color:var(--muted)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.welcome{max-width:760px;margin:10px auto}
.steps{display:grid;gap:12px;margin:20px 0}
.step{display:flex;gap:14px;align-items:center;background:#fff;border-radius:14px;padding:16px 18px}
.step .n{width:34px;height:34px;border-radius:50%;background:var(--y);display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.step.done .n{background:var(--green);color:#fff}
.step div{flex:1}
.step b{display:block}
.calbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.calleg{display:flex;gap:14px;flex-wrap:wrap;color:#52525b;font-size:13px}
.calleg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hatch{background:repeating-linear-gradient(135deg,#d4d4d8 0 4px,#f4f4f5 4px 8px)!important}
.calopts{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:8px 0 12px}
.calgrid{display:grid;border-top:1px solid var(--line)}
.calday{padding:10px 8px;border-left:1px solid var(--line2);text-align:center;position:sticky;top:56px;background:#fff;z-index:3}
.calday b{display:block;font-size:15px}
.calday span{font-size:12px;color:var(--muted);display:block}
.calday.today b{background:var(--y);border-radius:8px;display:inline-block;padding:1px 10px}
.caltimes{position:relative}
.caltimes span{position:absolute;right:10px;transform:translateY(-50%);font-size:12px;color:var(--muted);white-space:nowrap}
.caltimes span:first-child{transform:none}
.calcol{position:relative;border-left:1px solid var(--line2)}
.calcol.today{background:#fffef4}
.slot{position:absolute;left:0;right:0;border-top:1px dashed #f0efe9;cursor:pointer}
.slot.hr{border-top:1px solid var(--line2)}
.slot span{display:none;font-size:11px;color:var(--ink);padding:3px 6px;font-weight:600}
.slot:not(.past):hover{background:var(--y3)}
.slot:not(.past):hover span{display:block}
.slot.past{cursor:default;background:rgba(0,0,0,.018)}
.ev{position:absolute;border-left:4px solid;border-radius:7px;padding:4px 7px;overflow:hidden;cursor:pointer;z-index:2;font-size:12px;line-height:1.25;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.ev:hover{filter:brightness(.96);z-index:4}
.ev b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev span{color:#3f3f46;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ev.done{opacity:.55}
.ev.clash{outline:2px solid var(--red);background:var(--red2)!important}
.ev.clash b{color:var(--red)}
.busy{position:absolute;left:2px;right:2px;border-radius:6px;z-index:1;background:repeating-linear-gradient(135deg,#e4e4e7 0 5px,#f4f4f5 5px 10px);overflow:hidden;pointer-events:none}
.busy span{font-size:10px;color:#52525b;padding:2px 5px;display:block;white-space:nowrap}
.nowline{position:absolute;left:0;right:0;border-top:2px solid var(--red);z-index:5}
.nowline:before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--red)}
.avail{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px}
.avail-h{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}
.avail-t{position:relative;height:26px;background:#f4f3ee;border-radius:7px;overflow:hidden}
.avail-t i{position:absolute;top:3px;bottom:3px;border-radius:4px}
.avail-t i.pick{border:2px solid var(--ink);background:rgba(255,225,27,.55);top:0;bottom:0}
.avail-t i.pick.bad{border-color:var(--red);background:rgba(198,40,40,.25)}
.avail-x{position:relative;height:16px;font-size:10px;color:var(--muted)}
.avail-x span{position:absolute;transform:translateX(-50%);top:2px}
.avail-x span:first-child{transform:none}
.warnbox{background:var(--red2);color:#7f1d1d;border-radius:9px;padding:9px 12px;font-size:13px;margin-top:8px}
.okline{color:var(--green);font-weight:600;font-size:13px;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 11px;font-size:13px}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);color:var(--y);border-color:var(--ink)}
.gev{position:absolute;z-index:2;background:#e8eefc;border:1px solid #c3d0f0;border-left:4px solid #5b7fd6;border-radius:7px;padding:4px 7px;font-size:12px;line-height:1.25;overflow:hidden;cursor:pointer}
.gev:hover{background:#dfe7fb;z-index:4}
.gev b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#1e3a8a}
.gev span{color:#3f3f46;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gjoin{position:absolute;right:5px;bottom:4px;background:var(--y);color:var(--ink);font-weight:700;font-size:11px;padding:2px 8px;border-radius:6px;text-decoration:none}
.allday{display:block;font-style:normal;font-size:11px;background:#e8eefc;color:#1e3a8a;border-radius:5px;padding:1px 6px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{border:0;background:none;font-size:16px;padding:6px 8px;border-radius:8px;opacity:.45;margin-right:4px;vertical-align:middle}
.ibtn:hover{opacity:1;background:var(--red2)}
.btn.danger{color:var(--red);border-color:#f3c4c4;background:#fff}
.btn.danger:hover{background:var(--red2);border-color:var(--red)}
@media (max-width:1000px){.sidenav{width:180px;padding:18px 10px}.brand{font-size:18px}.tabs button{font-size:14px;padding:8px 10px}}
.orig{font-size:12px;color:var(--muted);margin:4px 2px 0}
.orig i{color:#3f3f46}
.orig .link{font-size:12px}
.crow .orig{grid-column:2;grid-row:2;margin-top:-4px}
.origv{background:#f1f5ff!important;border-color:#c3d0f0!important}
.seg2{display:flex;align-items:center;gap:2px;background:#ecebe5;border-radius:10px;padding:3px;font-size:13px}
.seg2 span{color:#52525b;padding:0 8px 0 6px}
.seg2 button{border:0;background:none;border-radius:8px;padding:6px 12px;font-weight:600;color:#52525b}
.seg2 button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.answrap{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:12px}
table.ans{border-collapse:separate;border-spacing:0;font-size:13px}
table.ans th{position:sticky;top:0;background:#f6f5f0;z-index:2;font-size:12px;white-space:normal;vertical-align:bottom;line-height:1.3;border-bottom:1px solid var(--line)}
table.ans td{border-bottom:1px solid var(--line2);vertical-align:top;padding:10px 12px}
table.ans th:first-child,table.ans td:first-child{position:sticky;left:0;background:#fff;z-index:1;box-shadow:1px 0 0 var(--line)}
table.ans th:first-child{z-index:3;background:#f6f5f0}
table.ans td.long{white-space:normal;max-width:340px}
table.ans .sc{min-width:44px;font-size:14px;padding:4px 0}
.thq{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ans-why{font-size:12px;color:#3f3f46;margin-top:6px;max-width:260px}
table.ov{table-layout:fixed;width:100%}
table.ov td{vertical-align:middle}
table.ov .nm{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis}
table.ov .uid{font-size:12px;color:var(--muted);margin-top:2px}
table.ov .tsel{width:100%;min-width:0}
.mlink{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--blue);font-weight:500;text-decoration:none;font-size:13px}
.mlink:hover{text-decoration:underline}
.addlink{border:1.5px dashed #d6d3c8;background:#fff;border-radius:9px;padding:7px 10px;color:#52525b;font-size:13px;white-space:nowrap}
.addlink:hover{border-color:var(--ink);color:var(--ink)}
.acts-cell{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.trash{border:1px solid #f3c4c4;background:#fff;color:var(--red);border-radius:9px;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.trash:hover{background:var(--red2);border-color:var(--red)}
.trash svg{width:16px;height:16px}
.step2{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.step2 h4{margin:0 0 8px;font-size:15px}
.found{background:var(--green2);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.notfound{background:var(--amber2);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:13px}
@media (max-width:1100px){.khead{grid-template-columns:1fr}.kpis,.kpis.k4,.rcards,.topics{grid-template-columns:1fr 1fr}.callgrid,.people,.kgrid,.sum-grid{grid-template-columns:1fr}.side{position:static}.fgrid{grid-template-columns:1fr 1fr}.whoami{display:none}}
/* Sub-sections */
.mods .arr{width:22px!important;flex-shrink:0;padding:6px 0!important;text-align:center!important;color:#d4d4d8;font-size:14px!important;border-radius:6px}
.mods .arr:hover{color:#fff;background:#27272a}
.mods .arrsp{width:22px;flex-shrink:0}
.mods:not(.nested) .arrsp{display:none}
.kids{display:flex;flex-direction:column;gap:2px;margin:2px 0 4px 22px;padding-left:8px;border-left:1px solid #3f3f46}
.modw.child>button[data-m]{font-size:14px;padding:7px 10px}
/* Dev mode */
body.dev .tabw[draggable]{cursor:grab}
.tabw.dragging{opacity:.4}
.tabw.drop-l{box-shadow:-3px 0 0 var(--ink)}
.tabw.drop-r{box-shadow:3px 0 0 var(--ink)}
body.dragging-tab .modw{outline:1px dashed #52525b;outline-offset:-1px;border-radius:10px}
.modw.drop-in{background:#3f3f46;outline:2px solid var(--y)!important;border-radius:10px}
body.dragging-tab .mods .dv{display:none!important}
.modw{display:flex;align-items:center;gap:2px}
.modw>button[data-m]{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dv{display:flex;align-items:center;gap:1px;flex-shrink:0}
.mods .dv button,.tabs .dv button{width:auto;background:none;border:0;border-radius:6px;padding:4px 5px;font-size:12px;line-height:1;font-weight:600}
.mods .dv button{color:#a1a1aa}
.mods .dv button:hover{background:#3f3f46;color:#fff}
.tabs .dv button{color:#71717a}
.tabs .dv button:hover{background:#f1f0ea;color:var(--ink)}
.dv button.del:hover{color:var(--red)!important}
.dv button:disabled{opacity:.25;cursor:default;background:none!important}
.tabw{display:flex;align-items:center;border-radius:10px}
body.dev .tabw{border:1px dashed #d4d4d8;padding-right:3px}
.tabw.hid>button[data-t]{opacity:.45;text-decoration:line-through}
.mods .devadd{margin-top:8px;border:1px dashed #52525b;color:var(--y);text-align:center}
.mods .devadd:hover{background:#27272a;color:var(--y)}
.tabs .devadd{border:1px dashed #a1a1aa;color:var(--ink);font-weight:600}
.devnote{display:none;margin-left:12px;font-size:12px;font-weight:700;color:#92400e;background:var(--amber2);padding:4px 10px;border-radius:99px;white-space:nowrap}
.gear.on{border-color:var(--y);color:var(--y)}
.pageid{margin-top:18px;padding:12px 14px;border:1px dashed #d4d4d8;border-radius:10px;font-size:14px}
.pageid code{background:#f4f4f5;padding:2px 6px;border-radius:6px;font-size:13px}
.acc label.devck{flex-basis:100%;border:0;background:none!important;padding:2px 0 4px;font-size:13px;font-weight:600;border-radius:0}
.acc .secl{flex-basis:100%;font-size:12px;color:var(--muted);margin-top:2px}
.modw .dv,.tabw .dv{display:none}
.modw:hover .dv,.modw:has(button.on) .dv,.tabw:hover .dv,.tabw:has(button.on) .dv{display:flex}
/* Top bar buttons */
.topacts{margin-left:auto;display:flex;gap:10px;padding-left:16px;flex-shrink:0}
.rowacts{display:flex;gap:10px}
.rowacts .btn{padding:10px 18px;font-size:14px;white-space:nowrap}
.topacts .btn{padding:9px 16px;font-size:14px;white-space:nowrap}
/* All Calls */
.pickers{display:flex;align-items:center;gap:22px}
.pk{display:flex;align-items:center;gap:8px;font-size:15px;color:#52525b;cursor:pointer;user-select:none}
.pk b{color:var(--ink);font-weight:700}
.pk .colbtn{margin-left:0}
.pmenu{min-width:200px;padding:8px}
.pmenu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:8px;font-size:14px}
.pmenu button:hover{background:#f4f4f0}
.pmenu button.on{background:var(--y3);font-weight:700}
.kpi b small{color:#a1a1aa;font-weight:500}
.kpi .ksub{color:#a1a1aa}
.nmlink{background:none;border:0;padding:0;text-align:left;font:inherit;font-weight:600;font-size:15px;color:var(--ink);cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.nmlink:hover{text-decoration:underline;color:var(--blue)}
.mdet{font-size:13px;color:#52525b;line-height:1.55}
.mrow{display:flex;align-items:center;gap:6px;min-width:0}
.pen{flex-shrink:0;width:26px;height:26px;border:1px solid var(--line);background:#fff;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:#52525b;padding:0}
.pen svg{width:14px;height:14px}
.pen:hover{border-color:var(--ink);color:var(--ink);background:var(--y3)}
.mdet .who2{color:var(--ink);font-weight:600}
.mdet .who2.none{color:#a1a1aa;font-weight:500}
/* Call page top bar */
.callbar .in-bar{gap:20px;padding:18px 30px;max-width:none}
.cb-back{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;white-space:nowrap}
.cb-back:hover{border-color:var(--ink)}
.callbar .who{min-width:0}
.callbar .who b{font-size:17px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.callbar .who div{font-size:12px;white-space:nowrap}
.cbmeet{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:10px 16px;display:flex;flex-direction:column;gap:3px;max-width:520px;margin:0 auto}
.cbmeet .l1{font-size:13px;color:#3f3f46;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbmeet .l1 b{color:var(--ink)}
.cbmeet .l2{display:flex;align-items:center;gap:8px;min-width:0}
.cbmeet .l2 a{font-size:13px;color:var(--blue);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none}
.cbmeet .l2 a:hover{text-decoration:underline}
.cbmeet .l2 .btn{padding:4px 10px;font-size:12px}
.callbar .prog{text-align:left;color:var(--ink)}
.callbar .prog #progTxt{font-size:20px;font-weight:800;font-family:Poppins,Inter,sans-serif;white-space:nowrap}
.callbar .prog #progTxt small{font-size:13px;font-weight:600;color:var(--muted);font-family:Inter,sans-serif}
.callbar .prog .pt{width:150px;height:8px}
.callbar .prog.full #progTxt{color:var(--green)}
.callbar .prog.full .pt i{background:var(--green)}
.callone{max-width:980px;margin:0 auto}
.qinfo{padding:18px 22px;margin-bottom:18px}
.qe .qn{width:22px;flex-shrink:0;color:#a1a1aa;font-weight:700;font-size:13px;text-align:right;align-self:center}
.qe input:disabled,.qe select:disabled,.sec input:disabled{background:#fafaf8;color:var(--ink);opacity:1}
.qi{padding:16px 0;border-top:1px solid var(--line2)}
.qi:first-of-type{border-top:0}
.qi .q-note{font-size:12px;color:var(--muted);margin-top:3px;font-style:italic}
.qi.missing{background:var(--red2);margin:0 -14px;padding:16px 14px;border-radius:10px}
.qi.flagged .q-title:after{content:" ⚑";color:var(--red)}
.req{color:var(--red);margin-left:3px;font-weight:700}
.qi[data-type="rating"]:not(.answered) .scale-help:after{content:" · not picked yet";color:var(--amber);font-weight:600}
.scale.s10 button{width:34px;height:40px;font-size:14px}
.scale.s10 button.on{width:36px;height:54px}
.qs{flex-wrap:wrap}
.qs button{width:auto;min-width:110px;padding:10px 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 12px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px}
.chips button i{width:14px;height:14px;border:1.5px solid #a1a1aa;border-radius:4px;display:inline-block}
.chips button.on{background:var(--ink);color:var(--y);border-color:var(--ink)}
.chips button.on i{background:var(--y);border-color:var(--y)}
.flagrow{display:flex;align-items:center;gap:10px;margin-top:8px}
.flagbtn{border:1px dashed #e7a1a1;background:#fff;color:var(--red);border-radius:9px;padding:6px 12px;font-size:13px;font-weight:600}
.flagbtn.on{background:var(--red);color:#fff;border-style:solid;border-color:var(--red)}
.flagnote{font-size:12px;color:var(--red);font-weight:600;margin-top:4px}
.flagrow .flagnote{margin-top:0}
.qb-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line2)}
.qb-row .qn{width:22px;text-align:right;color:#a1a1aa;font-weight:700;font-size:13px;flex-shrink:0}
.qb-main{flex:1;min-width:0}
.qb-text{font-size:15px}
.qb-ctl{display:flex;gap:4px;flex-shrink:0}
.qb-sec{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#f4f4f0;margin:10px -12px 0;padding:10px 12px;border-radius:10px;font-size:15px}
.qtype{flex-shrink:0;font-size:11px;font-weight:700;border-radius:99px;padding:3px 9px;background:#f1f0ea;color:#3f3f46;white-space:nowrap}
.qtype.t-rating{background:#fff6c2}
.qtype.t-single{background:#e3edff;color:#1d4ed8}
.qtype.t-multi{background:#ede4ff;color:#6d28d9}
.qtype.t-open{background:#e3f6ea;color:#15803d}
.qtypes{flex-wrap:wrap;margin:0 0 16px}
.qtypes button{width:auto;padding:9px 14px;font-size:14px}
.qpick-bar{display:flex;justify-content:space-between;margin-bottom:6px}
.qpick{max-height:340px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.qpick label{display:flex;align-items:center;gap:9px;padding:7px 4px;font-size:14px;cursor:pointer;border-top:1px solid var(--line2)}
.qpick label:first-child{border-top:0}
.qpick .qp-sec{background:#f4f4f0;border-radius:8px;margin-top:6px;border-top:0;padding:7px 8px}
.qpick .qn{width:20px;text-align:right;color:#a1a1aa;font-weight:700;font-size:12px}
.qpick input{accent-color:var(--ink);width:16px;height:16px;flex-shrink:0}
.qscard{cursor:pointer}
.qscard:hover{box-shadow:0 6px 20px rgba(0,0,0,.07)}
.qscard .rc-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qscard .rc-head h3{margin:0;font-size:22px}
.qscard .rc-nums{display:flex;gap:44px;margin:22px 0 18px}
.qscard .rc-nums b{display:block;font-family:Poppins,Inter,sans-serif;font-size:40px;font-weight:800;line-height:1.05}
.qscard .rc-nums span{color:#52525b;font-size:14px}
.qscard .rc-foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.addset{border:2px dashed #d6d3c8;background:transparent;box-shadow:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:220px;font-size:17px;font-weight:700;color:#3f3f46}
.addset em{font-style:normal;font-size:13px;color:var(--muted);font-weight:500}
.addset:hover{border-color:var(--ink);background:#fff}
.qpn{display:inline-block;min-width:20px;font-size:11px;background:rgba(0,0,0,.08);border-radius:99px;padding:1px 6px;margin-left:4px}
.devwarn{margin-left:10px;font-size:12px;font-weight:700;color:#b42318;background:#fde8e8;padding:5px 10px;border-radius:99px;white-space:nowrap}
.hbuilt{background:#f7f6f1;border-radius:12px;padding:12px 16px;margin-bottom:12px;font-size:14px}
.hbuilt ul{margin:6px 0 0;padding-left:18px}
.hbuilt li{margin:3px 0}
.hlist{max-height:420px;overflow-y:auto;border:1px solid var(--line);border-radius:12px}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 14px;border-top:1px solid var(--line2)}
.hrow:first-child{border-top:0}
.hrow.cur{background:var(--y3)}

<body>
<div class="layout">
<aside class="sidenav">
  <div class="brand">HR Dashboard</div>
  <nav class="mods" id="mods"></nav>
  <div class="sidefoot">
    <span class="whoami" id="whoAmI"></span>
    <button class="gear" id="btnDev" hidden>Dev mode: Off</button>
    <button class="gear" id="btnSettings">Settings</button>
  </div>
</aside>
<div class="shell">
<div class="topbar"><nav class="tabs" id="tabs"></nav><div class="topacts" id="topActs"></div></div>
<div id="callbar"></div>
<main id="app"><div class="loading"><span class="spin"></span> Loading…</div></main>
</div>
</div>
<div id="modal"></div>
<div id="fmenu"></div>
<div id="toast"></div>

<script type="application/json" id="bootData"><?!= boot ?></script>
<script>
(function () {
  function show(msg) {
    var a = document.getElementById('app');
    if (!a || !a.querySelector('.loading')) { var t = document.getElementById('toast'); if (t) { t.textContent = 'Error: ' + msg; t.className = 'err'; t.style.display = 'block'; } return; }
    a.innerHTML = '<div class="card" style="max-width:680px;margin:40px auto"><h3>HR Dashboard could not start</h3>' +
      '<p style="color:#d64545;font-weight:600;word-break:break-word">' + String(msg).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }) + '</p>' +
      '<p class="hint">Please send a screenshot of this message to whoever set up the app.</p>' +
      '<button class="btn y" onclick="location.reload()">Reload</button></div>';
  }
  window.__showFatal = show;
  window.addEventListener('error', function (e) { show((e.message || 'Script error') + (e.lineno ? ' (line ' + e.lineno + ')' : '')); });
  window.addEventListener('unhandledrejection', function (e) { var r = e.reason; if (r && r.__shown) return; show((r && r.message) || String(r)); });
  setTimeout(function () {
    var a = document.getElementById('app');
    if (a && a.querySelector('.loading')) show('Still loading after 25 seconds. Check your internet, then reload. If it keeps happening: in the Apps Script editor run the function diagnose and send the result.');
  }, 25000);
})();
</script>
<script>
const S = { cfg: null, leaders: [], calls: [], concerns: [], round: '', view: 'overview', prevView: 'overview', call: null, qtr: {},
  timer: { running: false, startedAt: 0, elapsed: 0, tick: null }, dirty: false, removedConcerns: [], sumRound: '' };

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sept', 'Oct', 'Nov', 'Dec'];
function todayStr(d = new Date()) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function addDays(str, n) { const d = new Date(str + 'T00:00:00'); d.setDate(d.getDate() + n); return todayStr(d); }
function hhmm(d = new Date()) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function dmy(s) { if (!s) return ''; const p = String(s).slice(0, 10).split('-'); return p.length === 3 ? Number(p[2]) + ' ' + MON[Number(p[1]) - 1] + ' ' + p[0] : s; }
function niceDate(s) { return dmy(s); }
function monthKey(s) { if (!s) return 'No date'; const p = String(s).split('-'); return MON[Number(p[1]) - 1] + ' ' + p[0]; }
function ampm(t) { if (!t) return ''; const [h, m] = String(t).split(':').map(Number); return ((h % 12) || 12) + ':' + pad(m || 0) + ' ' + (h < 12 ? 'AM' : 'PM'); }
function langName(code) { const l = (S.cfg.languages || []).find(x => x.code === code); return l ? l.name : (code || 'English'); }
function leader(id) { return S.leaders.find(l => l.id === id); }
function scoreOf(c, k) {
  if (!c._sc) { try { c._sc = typeof c.scoreMap === 'object' && c.scoreMap ? c.scoreMap : (c.scores && typeof c.scores === 'string' ? JSON.parse(c.scores) : (c.scores || {})); } catch (e) { c._sc = {}; } }
  return Number(c._sc[k]) || Number(c['s_' + k]) || 0;
}
function lines(s) { return String(s || '').split('\n').map(x => x.trim()).filter(Boolean); }
function rMeta(r) { return (S.cfg.roundsMeta || {})[r] || { year: (String(r).match(/20\d\d/) || [''])[0], label: r, period: '', presentations: [] }; }
function rName(r) { const m = rMeta(r); return m.year && m.label !== r ? m.year + ' · ' + m.label : r; }
function rPeriod(r) { const m = rMeta(r); return m.period ? m.period + ' ' + m.year : ''; }
function hrName(email) {
  if (!email) return '';
  const t = (S.cfg.hrTeam || []).find(h => h.email === String(email).toLowerCase());
  if (t) return t.name;
  return /@/.test(email) ? String(email).split('@')[0].split(/[._-]/)[0].replace(/^./, c => c.toUpperCase()) : email;
}
function hrOptions(sel) {
  const team = S.cfg.hrTeam || [];
  const extra = sel && !team.some(h => h.email === String(sel).toLowerCase()) ? [{ email: sel, name: hrName(sel) }] : [];
  return '<option value="">Unassigned</option>' + team.concat(extra).map(h => `<option value="${esc(h.email)}" ${String(sel || '').toLowerCase() === h.email ? 'selected' : ''}>${esc(h.name)}</option>`).join('');
}

const OUTDATED = 'The app\'s server code (Code.gs) is older than this page. In Apps Script paste the latest Code.gs, save, then Deploy → Manage deployments → Edit → New version.';
function api(fn, ...args) {
  return new Promise((res, rej) => {
    const fail = e => { toast(e && e.message ? e.message : String(e), true); try { e.__shown = true; } catch (x) {} rej(e); };
    const runner = google.script.run.withSuccessHandler(res).withFailureHandler(fail);
    if (typeof runner[fn] !== 'function') return fail(new Error(OUTDATED));
    runner[fn](...args);
  });
}
let toastT;
function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', err ? 6000 : 3200);
}
function setData(d) { S.leaders = d.leaders || []; S.calls = d.calls || []; S.concerns = d.concerns || []; updateBadge(); }
function busy(btn, on, label) {
  if (!btn) return;
  if (on) { btn.dataset.l = btn.innerHTML; btn.innerHTML = '<span class="spin"></span> ' + (label || 'Working…'); btn.disabled = true; }
  else { btn.innerHTML = btn.dataset.l || btn.innerHTML; btn.disabled = false; }
}
const isOpenK = k => !k.status || k.status === 'Open' || k.status === 'In progress';
function updateBadge() { const n = S.concerns.filter(isOpenK).length; const b = $('#kBadge'); if (b) b.textContent = n || ''; }

function boot() {
  const inAppsScript = typeof google !== 'undefined' && google.script && google.script.run;
  if (!inAppsScript) return notInAppsScript();
  let b = null;
  try { b = JSON.parse(document.getElementById('bootData').textContent); } catch (e) { b = null; }
  if (b && b.cfg) return start(b);
  if (b && b.error) return loadError(b.error);
  loadFromServer();
}
function notInAppsScript() {
  $('#app').innerHTML = `<div class="card" style="max-width:680px;margin:40px auto">
    <h3>This file only runs inside Google Apps Script</h3>
    <p>You opened <b>Index.html</b> directly, so it can't reach the app's data. That's expected.</p>
    <ol style="line-height:1.8"><li>In the Apps Script editor click <b>Deploy → Manage deployments</b>.</li>
      <li>Copy the <b>Web app URL</b> (ends in <code>exec</code>) and open that link instead.</li></ol></div>`;
}
function loadFromServer() {
  $('#app').innerHTML = '<div class="loading"><span class="spin"></span> Loading…</div>';
  google.script.run.withSuccessHandler(start).withFailureHandler(e => loadError(e && e.message ? e.message : String(e))).getBootstrap();
}
function start(b) {
  try {
    applyBoot(b);
    setTimeout(prefetch, 1200);
    S.round = S.cfg.currentRound || S.cfg.rounds[S.cfg.rounds.length - 1] || '';
    const first = (S.cfg.modules || []).find(m => hasMod(m.id));
    if (!first) { renderMods(); $('#tabs').hidden = true; $('#app').innerHTML = '<div class="card" style="max-width:640px;margin:40px auto"><h3>No sections yet</h3><p>Your HR admin hasn\'t given you access to any section. Ask them to tick the sections for you in Settings.</p></div>'; return; }
    const isPO = (m, t) => t.id === 'dirOverview' || (m.tabs.some(x => x.id === 'directory') && /^\s*overview\s*$/i.test(t.name));
    const po = (S.cfg.modules || []).find(m => hasMod(m.id) && m.tabs.some(t => !t.hidden && isPO(m, t)));
    if (po) return openModule(po.id, po.tabs.find(t => !t.hidden && isPO(po, t)).id);
    const home = S.cfg.callAccess && (S.cfg.modules || []).find(m => hasMod(m.id) && m.tabs.some(t => t.id === 'overview'));
    openModule(home ? home.id : first.id);
  } catch (e) { loadError('Starting failed: ' + e.message); }
}
function prefetch() {
  const hasPipe = (S.cfg.modules || []).some(m => hasMod(m.id) && (/pipeline/i.test(m.name) || m.tabs.some(t => t.id === 'pipeline')));
  if (hasPipe && !S.cands) apiQ('getCandidates').then(d => { if (!S.cands) { S.cands = d; if (S.view === 'page' && $('#app .loading') && /pipeline/i.test($('#app').textContent)) renderPage(); } }).catch(() => {});
  const hasDir = (S.cfg.modules || []).some(m => hasMod(m.id) && (/birthday/i.test(m.name) || m.tabs.some(t => ['directory', 'dirAdmin', 'birthdays', 'dirOverview'].includes(t.id))));
  if (hasDir && !S.dir) apiQ('getDirectory').then(d => { if (!S.dir) S.dir = d; }).catch(() => {});
  const keys = [];
  (S.cfg.modules || []).filter(m => hasMod(m.id)).forEach(m => m.tabs.forEach(t => { const k = pageKey(m, t); if (k && !keys.includes(k)) keys.push(k); }));
  keys.forEach((k, i) => setTimeout(() => {
    const st = STORE[k]; if (!st || st.get()) return;
    st.load().then(d => { if (!st.get()) { st.set(d); FETCHED[k] = Date.now(); if (st.here() && $('#app .loading')) st.render(); } }).catch(() => {});
  }, 600 + i * 350));
}
function applyBoot(b) {
  S.cfg = b.cfg; setData(b.data || {});
  if (b.dir) S.dir = b.dir;
  S.cfg.rounds = S.cfg.rounds || []; S.cfg.roundsMeta = S.cfg.roundsMeta || {}; S.cfg.hrTeam = S.cfg.hrTeam || [];
  if (S.round && !S.cfg.rounds.includes(S.round)) S.round = S.cfg.currentRound;
  $('#whoAmI').textContent = 'Signed in as ' + (hrName(S.cfg.me) || S.cfg.me || '');
  $('#whoAmI').title = S.cfg.me || '';
}
function loadError(msg) {
  $('#app').innerHTML = `<div class="card" style="max-width:640px;margin:40px auto"><h3>Could not load HR Dashboard</h3>
    <p style="color:var(--red);font-weight:600">${esc(msg)}</p>
    <p class="hint">Common fixes: run <b>diagnose</b> once in the Apps Script editor · after changing code use Deploy → Manage deployments → Edit → <b>New version</b> · open the app with an account that is in Settings → HR team.</p>
    <button class="btn y" id="retryLoad">Try again</button></div>`;
  $('#retryLoad').onclick = loadFromServer;
}
const hasMod = id => (S.cfg.myModules || []).includes(id);
const KR_VIEWS = ['overview', 'people', 'concerns', 'analysis', 'questions'];
const curMod = () => (S.cfg.modules || []).find(m => m.id === S.mod);
const visTabs = m => (m ? m.tabs : []).filter(t => S.devMode || !t.hidden);
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function activeTab() {
  if (S.view === 'page') return S.tab;
  const v = S.view === 'round' ? 'analysis' : S.view === 'call' ? S.prevView : S.view;
  return v;
}
const kidsOf = (L, id) => L.filter(m => m.parent === id);
function renderMods() {
  const dev = !!S.devMode;
  document.body.classList.toggle('dev', dev);
  S.open = S.open || {};
  const L = S.cfg.modules || [];
  const mine = L.filter(m => hasMod(m.id));
  const ids = mine.map(m => m.id);
  const cur = L.find(m => m.id === S.mod);
  const isOpen = m => S.open[m.id] !== undefined ? S.open[m.id] : (m.id === S.mod || (!!cur && cur.parent === m.id));
  const tops = mine.filter(m => !m.parent || !ids.includes(m.parent));
  const ctrls = (m, sibs, i) => dev ? `<span class="dv">
      <button data-mmv="-1" data-id="${esc(m.id)}" title="Move up" ${i === 0 ? 'disabled' : ''}>↑</button><button data-mmv="1" data-id="${esc(m.id)}" title="Move down" ${i === sibs.length - 1 ? 'disabled' : ''}>↓</button>${!m.parent || !ids.includes(m.parent) ? `<button data-msub="${esc(m.id)}" title="Add a sub-section under ${esc(m.name)}">+</button>` : ''}<button data-mren="${esc(m.id)}" title="Rename">✎</button>${m.builtin ? '' : `<button class="del" data-mdel="${esc(m.id)}" title="Delete section">✕</button>`}</span>` : '';
  const row = (m, sibs, i, kids, child) => {
    const open = kids.length && isOpen(m);
    return `<div class="modw ${child ? 'child' : ''}" data-row="${esc(m.id)}">${kids.length ? `<button class="arr" data-tog="${esc(m.id)}" title="${open ? 'Hide' : 'Show'} the ${kids.length} section${kids.length === 1 ? '' : 's'} under ${esc(m.name)}">${open ? '▾' : '▸'}</button>` : (child ? '' : '<span class="arrsp"></span>')}<button data-m="${esc(m.id)}" class="${m.id === S.mod ? 'on' : ''}" title="${esc(m.name)}">${esc(m.name)}</button>${ctrls(m, sibs, i)}</div>`;
  };
  const anyKids = tops.some(t => kidsOf(mine, t.id).length);
  $('#mods').classList.toggle('nested', anyKids);
  $('#mods').innerHTML = (tops.map((t, i) => {
    const kids = kidsOf(mine, t.id);
    return row(t, tops, i, kids, false) + (kids.length && isOpen(t) ? `<div class="kids">${kids.map((k, j) => row(k, kids, j, [], true)).join('')}</div>` : '');
  }).join('') || '<p class="hint" style="color:#a1a1aa;padding:0 12px">No sections yet</p>') + (dev ? '<button class="devadd" id="addMod">+ Add section</button><button class="devadd" id="layHist">Menu history · undo</button>' : '');
  const db = $('#btnDev');
  if (db) { db.hidden = !S.cfg.isDev; db.textContent = dev ? 'Dev mode: On' : 'Dev mode: Off'; db.classList.toggle('on', dev); }
}
function renderTabs() {
  const m = curMod(), nav = $('#tabs');
  if (!m) { nav.innerHTML = ''; return; }

function closeMenu() { const m = $('#fmenu'); if (m) m.innerHTML = ''; }

function colMenu(btn, k) {
  const col = OVCOLS.find(c => c.k === k);
  const base = ovFiltered(leaderRows(), k);
  const counts = {};
  base.forEach(r => { const v = col.val(r); counts[v] = (counts[v] || 0) + 1; });
  if (k === 'country') (S.cfg.countries || []).forEach(c => { if (!(c in counts)) counts[c] = 0; });
  if (k === 'status') Object.keys(ST).forEach(s => { if (!(ST[s][0] in counts)) counts[ST[s][0]] = 0; });
  let vals = Object.keys(counts);
  if (k === 'status') vals.sort((a, b) => Object.values(ST).find(x => x[0] === a)[2] - Object.values(ST).find(x => x[0] === b)[2]);
  else if (k === 'date') vals.sort((a, b) => (a === 'No date' ? 1 : b === 'No date' ? -1 : new Date('1 ' + a.replace('Sept', 'Sep')) - new Date('1 ' + b.replace('Sept', 'Sep'))));
  else vals.sort((a, b) => counts[b] - counts[a] || a.localeCompare(b));
  const sel = new Set(OV.f[k] || vals);
  const r = btn.getBoundingClientRect();
  const m = $('#fmenu');
  const draw = q => {
    const shown = vals.filter(v => !q || v.toLowerCase().includes(q.toLowerCase()));
    $('.vals', m).innerHTML = shown.map(v => `<label class="val"><input type="checkbox" value="${esc(v)}" ${sel.has(v) ? 'checked' : ''}><span>${esc(v)}</span><em>${counts[v]}</em></label>`).join('') || '<p class="hint">No values</p>';
    $('.shown', m).textContent = shown.reduce((a, v) => a + counts[v], 0) + ' shown';
  };
  m.innerHTML = `<div class="fmenu" style="top:${r.bottom + window.scrollY + 8}px;left:${Math.min(r.left + window.scrollX - 20, window.innerWidth - 360)}px">
    <button class="srt" data-dir="1">↑ Sort A → Z</button><button class="srt" data-dir="-1">↓ Sort Z → A</button><hr>
    <b style="font-size:15px">Filter by values</b>
    <div style="display:flex;justify-content:space-between;margin:6px 0 10px"><span><button class="link" id="fmAll">Select all</button> · <button class="link" id="fmNone">Clear</button></span><span class="hint shown" style="font-size:14px"></span></div>
    <input class="in" id="fmQ" placeholder="Search values">
    <div class="vals"></div>
    <div class="acts"><button class="btn" id="fmCancel">Cancel</button><button class="btn dark" id="fmOk">OK</button></div></div>`;
  draw('');
  $('.vals', m).onchange = e => { if (e.target.checked) sel.add(e.target.value); else sel.delete(e.target.value); };
  $('#fmQ').oninput = e => draw(e.target.value);
  $('#fmAll').onclick = () => { vals.forEach(v => sel.add(v)); draw($('#fmQ').value); };
  $('#fmNone').onclick = () => { sel.clear(); draw($('#fmQ').value); };
  $('#fmCancel').onclick = closeMenu;
  $$('.srt', m).forEach(b => b.onclick = () => { OV.sort = { k, dir: Number(b.dataset.dir) }; closeMenu(); renderOverview(); });
  $('#fmOk').onclick = () => { OV.f[k] = sel.size === vals.length ? null : [...sel]; closeMenu(); renderOverview(); };
}

function parseLeaders(text) {
  const normGroup = g => { const t = (g || '').trim(); if (S.cfg.groups.includes(t)) return t; g = t.toLowerCase();

function roundStats(r) {
  const rows = roundRows(r), n = rows.length;
  const done = rows.filter(x => x.st === 'completed');
  const calls = done.map(x => x.call);
  const hs = Qof(r).health.filter(h => !h.workload);
  const vals = calls.flatMap(c => hs.map(h => scoreOf(c, h.key)).filter(Boolean));
  const avg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
  const anyCall = S.calls.some(c => c.round === r && c.status !== 'Cancelled');
  return { rows, n, done: done.length, calls, avg, anyCall };
}
function roundState(r, st) {
  const i = S.cfg.rounds.indexOf(r), cur = S.cfg.rounds.indexOf(S.cfg.currentRound);
  if (st.done && st.done >= st.n) return ['Completed', 't-done'];
  if (r === S.cfg.currentRound || st.anyCall && i >= cur) return st.anyCall || r === S.cfg.currentRound ? ['In progress', 't-prog'] : ['Not started', 't-none'];
  if (!st.anyCall) return i > cur ? ['Not started', 't-none'] : ['No calls', 't-none'];
  return ['Partial', 't-prog'];
}

function qPickDefaults(fromRound) {

function openCall(leaderId) {
  const l = leader(leaderId); if (!l) return;

  closeMenu();
  $('#app').innerHTML = '<div class="loading"><span class="spin"></span> Opening call…</div>';
  api('openCallForLeader', leaderId, S.round).then(call => {
    S.call = call || { leaderId, round: S.round, status: 'Assigned', language: l.language || 'en', conductedBy: S.cfg.me, reasons: {}, answers: {}, concerns: [] };
    S.removedConcerns = []; S.dirty = false; S.endAfterUpload = false;
    S.timer = { running: false, startedAt: 0, elapsed: (Number(S.call.durationMins) || 0) * 60000, tick: null };
    const keepWin = S.rec && S.rec.win && !S.rec.win.closed && S.rec.state === 'recording' ? S.rec.win : null;

function parseTsv(t) {
  const rows = []; let row = [], cell = '', q = false;
  t = String(t || '').replace(/\r\n?/g, '\n');
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; continue; }
    if (ch === '"' && cell === '') { q = true; continue; }
    if (ch === '\t') { row.push(cell); cell = ''; continue; }
    if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; continue; }
    cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r => r.map(c => c.trim())).filter(r => r.some(Boolean));
}

function normDirVal(k, v) {

}

}

function spanTextYears(from, to) {
  let y = to.getFullYear() - from.getFullYear();
  if (to.getMonth() < from.getMonth() || (to.getMonth() === from.getMonth() && to.getDate() < from.getDate())) y--;
  return y;
}

  </div>
  <div class="pokpis">${kpi.map((k, i) => `<div class="card ${i === 3 ? 'pi-accent' : ''}"><span>${k[0]}</span><b>${k[1]}</b><em class="hint">${esc(k[2])}</em></div>`).join('')}</div>

function dateModal(c, kind, move) {
  const iv = kind === 'interview';
  const d0 = iv ? c.interviewDate : c.tasksDate, t0 = iv ? c.interviewTime : c.tasksTime;
  const gcal = (d, t) => {
    if (!d) return '';
    const [h, m] = (t || '09:00').split(':').map(Number), st = new Date(Number(d.slice(0, 4)), Number(d.slice(5, 7)) - 1, Number(d.slice(8, 10)), h, m), en = new Date(st.getTime() + (iv ? 60 : 120) * 6e4);
    const f = x => x.getFullYear() + pad(x.getMonth() + 1) + pad(x.getDate()) + 'T' + pad(x.getHours()) + pad(x.getMinutes()) + '00';
    const q = { text: (iv ? 'Interview — ' : 'Candidate tasks — ') + cName(c), dates: f(st) + '/' + f(en), details: 'HR Dashboard · Hiring Pipeline', add: c.email || '', ctz: S.cfg.tz || 'Asia/Manila' };
    if (iv) q.vcon = 'meet';
    return 'https:' + String.fromCharCode(47, 47) + 'calendar.google.com/calendar/r/eventedit?' + Object.keys(q).filter(k => q[k]).map(k => k + '=' + encodeURIComponent(q[k])).join('&');
  };
  modal(`<h3 class="pi-mh"><span class="pi-ib">${PI.cal}</span>${iv ? 'Interview' : move ? 'Move to Emplanner Request' : 'Candidate tasks'} — ${esc(cName(c))}</h3>
    <p class="hint" style="margin-top:-6px">${iv ? 'Pick the interview date and time.' : 'Pick the date of the candidate tasks (Emplanner request).' + (move ? ' The candidate moves to Candidate Tasks.' : '')}</p>

      <div class="f"><label>Date</label><input type="date" class="in" id="dmD" value="${esc(d0 || ymd(new Date()))}"></div>
      <div class="f"><label>Time</label><input type="time" class="in" id="dmT" value="${esc(t0 || '09:00')}"></div></div>
    <button type="button" class="btn sm pi-ib" id="dmCal">${PI.cal}Also add it to my Google Calendar</button>

      closeModal(); pipeAct(c.id, iv ? 'schedule' : 'tasks', data, move ? cName(c) + ' moved to Candidate Tasks' : 'Saved');
    };

let PIPE_PENDING = 0;
function pipeLocal(c, act, d) {
  const now = new Date(), today = ymd(now), stamp = today + 'T' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
  const go = st => { c.stage = st; c.stageAt = stamp; };
  if (act === 'move') go(d.stage);
  else if (act === 'schedule') { c.interviewDate = d.interviewDate; c.interviewTime = d.interviewTime; if (c.stage === 'applied' || c.stage === 'screening') go('interview'); }
  else if (act === 'tasks') { c.tasksDate = d.tasksDate; c.tasksTime = d.tasksTime; if (d.move) go('tasks'); }
  else if (act === 'account') c.accountAt = stamp;
  else if (act === 'pass') { c.taskResult = 'Pass'; go('offer'); }
  else if (act === 'fail') { c.taskResult = 'Fail'; c.status = 'Rejected'; c.rejectReason = 'Failed the candidate tasks'; }
  else if (act === 'reject') { c.status = 'Rejected'; c.rejectReason = d.reason || ''; }
  else if (act === 'restore') { c.status = 'Active'; c.rejectReason = ''; if (c.taskResult === 'Fail') c.taskResult = ''; }
  else if (act === 'hire') { go('hired'); c.hiredAt = today; }
  if ((S.cands.hidden || []).includes(c.stage)) S.cands.rows = S.cands.rows.filter(x => x !== c);
}
function pipeAct(id, act, d, msg) {
  pipeDo('candidateAction', [id, act, d], () => { const c = S.cands.rows.find(x => x.id === id); if (c) pipeLocal(c, act, d); }, msg);
}
function pipeDo(fn, args, local, msg) {
  local();
  renderPipeline();
  toast(msg);
  PIPE_PENDING++;
  const onPage = () => S.view === 'page' && $('.pi-board') && !$('.modal');
  api(fn, ...args).then(d => {
    PIPE_PENDING--;
    if (PIPE_PENDING) return;
    S.cands = d;
    if (onPage()) renderPipeline();
  }).catch(() => {
    PIPE_PENDING--;
    pipeLoad().then(() => { if (onPage()) renderPipeline(); }).catch(() => {});
  });
}
